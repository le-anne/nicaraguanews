[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Build image Node (also drives default Functions runtime when valid).
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # Keep function bundles on a modern Node. The Lambda *runtime* itself must be
  # set in the Netlify UI/CLI as AWS_LAMBDA_JS_RUNTIME=nodejs22.x (not allowed here).

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/news"
  to = "/.netlify/functions/api/news"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true
